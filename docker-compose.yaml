services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: taskdb
      MYSQL_USER: ${MYSQL_USER:-taskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    restart: unless-stopped
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      - ./${ROCKETMQ_BROKER_CONF:-broker.conf}:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  rocketmq-console:
    image: styletang/rocketmq-console-ng:1.0.0
    restart: unless-stopped
    ports:
      - "${ROCKETMQ_CONSOLE_PORT:-8088}:8080"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      ROCKETMQ_CONFIG_ISVIPCHANNEL: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy

  app:
    profiles: ["app-docker"]
    build: .
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&preserveInstants=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-taskuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-taskpass}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      ROCKETMQ_BROKER_ADDRESS: host.docker.internal:${ROCKETMQ_BROKER_PORT:-10911}
      ROCKETMQ_PRODUCER_GROUP: task-scheduler-bootstrap
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-50}
      TASK_MAX_PAYLOAD_BYTES: ${TASK_MAX_PAYLOAD_BYTES:-262144}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
