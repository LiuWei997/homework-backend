spring:
  application:
    name: task-scheduling-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&preserveInstants=true}
    username: ${SPRING_DATASOURCE_USERNAME:taskuser}
    password: ${SPRING_DATASOURCE_PASSWORD:taskpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: GMT+08:00
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  broker-address: ${ROCKETMQ_BROKER_ADDRESS:localhost:10911}
  topic: ${ROCKETMQ_TOPIC:task-schedule-topic}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:task-scheduler-bootstrap}

scheduler:
  max-sleep: ${SCHEDULER_MAX_SLEEP:PT30S}
  publish-lease: ${SCHEDULER_PUBLISH_LEASE:PT1M}
  batch-size: ${SCHEDULER_BATCH_SIZE:50}

task:
  max-payload-bytes: ${TASK_MAX_PAYLOAD_BYTES:262144}
